name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build (server + TV bundle)
        run: npm run build
      - name: Unit + API integration tests with coverage
        run: npm run test:coverage
      - name: Smoke test (main journey against a running server)
        run: |
          DEV_OUTBOX=1 DATABASE_FILE=/tmp/ci.db UPLOAD_DIR=/tmp/ci-uploads PORT=3000 node dist/server.js &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
          BASE=http://localhost:3000 bash scripts/smoke.sh
      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high --omit=dev

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci && npm run build:web
      - name: Android unit tests, lint, debug APK
        working-directory: android-tv
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: masjid-pulse-tv-debug
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
