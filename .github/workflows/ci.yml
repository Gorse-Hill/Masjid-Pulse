name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build (server + TV bundle)
        run: npm run build
      - name: Unit + API integration tests with coverage
        run: npm run test:coverage
      - name: Smoke test
        run: |
          DEV_OUTBOX=1 DATABASE_FILE=/tmp/ci.db UPLOAD_DIR=/tmp/ci-uploads PORT=3000 node dist/server.js &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
          BASE=http://localhost:3000 bash scripts/smoke.sh
      - name: Dependency audit (high/critical)
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci && npm run build:web
      - name: Make gradlew executable
        run: chmod +x android-tv/gradlew
      - name: Android unit tests, lint, debug APK
        working-directory: android-tv
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Launch on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r android-tv/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.masjidpulse.tv || true
            adb shell monkey -p com.masjidpulse.tv 1
            sleep 12
            adb shell pidof com.masjidpulse.tv
            adb shell dumpsys activity activities | grep -E 'com.masjidpulse.tv/.MainActivity|mResumedActivity'
            adb logcat -d -s MasjidPulse AndroidRuntime chromium > android-tv-runtime.log
            adb exec-out screencap -p > android-tv-runtime.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masjid-pulse-android-verification
          path: |
            android-tv/app/build/outputs/apk/debug/app-debug.apk
            android-tv/app/build/reports/tests/testDebugUnitTest/**
            android-tv/app/build/reports/lint-results-debug.html
            android-tv-runtime.log
            android-tv-runtime.png
          if-no-files-found: warn
