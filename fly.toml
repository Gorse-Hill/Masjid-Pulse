# Fly.io config for Masjid Pulse. `fly launch --copy-config --no-deploy` lets you pick a unique app
# name and region (it rewrites `app` and `primary_region`). Secrets (JWT_SECRET, APP_URL, SMTP_*) are
# set with `fly secrets set`, never here.
app = "masjid-pulse"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_FILE = "/data/masjid-pulse.db"
  UPLOAD_DIR = "/data/uploads"
  TRUST_PROXY = "1"
  # Admin is forced to HTTPS by the app; the TV display may use plain HTTP (old TV certificate stores).
  HTTPS_REDIRECT = "1"

# SQLite + slide uploads. Create once: fly volumes create masjid_data --size 1 --region jnb
[mounts]
  source = "masjid_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = false
  # One always-on machine: SQLite on a volume cannot be shared, and TVs poll every 30 s anyway.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
